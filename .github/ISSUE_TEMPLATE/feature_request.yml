name: Feature request
description: Something you'd like Green to do. Please read the note at the top of the form first.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Green is a personal project. I built it for my own books, and I add what I need. You're welcome to file a request, but I may close it without action if it doesn't fit how I use Green. That isn't a judgement on the idea.

        If you need it soon, fork Green. It's MIT licensed, and for most "I wish it did X" a fork is the right answer.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation matters more than the solution. What are you doing with your books when Green gets in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: If you have a change in mind, describe it.
  - type: dropdown
    id: pull-request
    attributes:
      label: Would you send a pull request for this?
      description: If so, wait for a reply here before you start, so you don't spend time on something I won't merge.
      options:
        - "Yes"
        - "No"
